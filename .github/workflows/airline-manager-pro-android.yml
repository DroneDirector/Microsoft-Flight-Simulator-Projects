name: Airline Manager Pro – build

on:
  push:
    branches: [main]
    paths:
      - 'Airline-Manager-Pro/**'
      - '.github/workflows/airline-manager-pro-android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: airline-manager-pro-build
  cancel-in-progress: true

jobs:
  pc:
    name: PC app (Windows)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: Airline-Manager-Pro/pc-bridge
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Check the SimConnect library API
        run: npx tsc -p ci/tsconfig.json

      - name: Build
        run: npx tsc -p tsconfig.json

      - name: Test flight tracking and the Wi-Fi link
        run: npm test

      - name: Package
        run: node ci/package-pc.mjs

      - name: Smoke test the packaged app
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "build/Airline Manager Pro PC/AirlineManagerPro-PC.exe" -ArgumentList "--demo","50" -PassThru -NoNewWindow
          Start-Sleep -Seconds 6
          $r = Invoke-RestMethod -Uri "http://127.0.0.1:47610/info"
          Write-Output ("PC app answered: " + $r.app + " " + $r.version)
          Stop-Process -Id $p.Id -Force
          if ($r.app -ne "Airline Manager Pro") { exit 1 }

      - name: Zip
        id: zip
        shell: pwsh
        run: |
          $v = (Get-Content ../app.config.json | ConvertFrom-Json).version
          $f = "AirlineManagerPro-PC-$v.zip"
          Compress-Archive -Path "build/Airline Manager Pro PC" -DestinationPath $f
          "file=$f" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: airline-manager-pro-pc
          path: Airline-Manager-Pro/pc-bridge/${{ steps.zip.outputs.file }}

  apk:
    name: Android app
    needs: pc
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Airline-Manager-Pro
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Build web app
        run: npm run build

      - name: Prepare Android project
        run: bash scripts/android-setup.sh

      - name: Build APK
        working-directory: Airline-Manager-Pro/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Name the APK
        id: apk
        run: |
          V=$(node -p "require('./app.config.json').version")
          N=$(node -p "require('./app.config.json').appName.replace(/\s+/g,'')")
          F="${N}-${V}.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$F"
          keytool -printcert -jarfile "$F" | grep -m1 "Owner:"
          echo "file=Airline-Manager-Pro/$F" >> "$GITHUB_OUTPUT"
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          name: airline-manager-pro-pc
          path: pc

      - uses: actions/upload-artifact@v4
        with:
          name: airline-manager-pro-apk
          path: ${{ steps.apk.outputs.file }}

      - name: Publish pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: airline-manager-pro-v${{ steps.apk.outputs.version }}
          name: Airline Manager Pro ${{ steps.apk.outputs.version }}
          prerelease: true
          body_path: Airline-Manager-Pro/release-notes/${{ steps.apk.outputs.version }}.md
          files: |
            ${{ steps.apk.outputs.file }}
            pc/*.zip
