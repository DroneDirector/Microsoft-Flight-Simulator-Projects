name: Airline Manager Pro – build

on:
  push:
    branches: [main]
    paths:
      - 'Airline-Manager-Pro/**'
      - '!Airline-Manager-Pro/tools/market/**'
      - '!Airline-Manager-Pro/docs/**'
      - '.github/workflows/airline-manager-pro-android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: airline-manager-pro-build
  cancel-in-progress: true

jobs:
  voice:
    name: Voice pack
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: amp-voice-pack-1
    steps:
      - uses: actions/checkout@v4

      - name: Build and publish the voice pack (once)
        working-directory: Airline-Manager-Pro/tools/voice
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then echo "Voice pack $TAG is published"; exit 0; fi
          pip install --quiet numpy
          mkdir -p src/misaki out
          M=https://raw.githubusercontent.com/hexgrad/misaki/fba1236595f2d2bf21d414ba6e57d25256afada3
          for f in gb_gold gb_silver us_gold us_silver; do curl -fsSL -o src/misaki/$f.json $M/misaki/data/$f.json; done
          curl -fsSL -o src/LICENSE-misaki-Apache-2.0.txt $M/LICENSE
          curl -fsSL -o src/LICENSE-Kokoro-Apache-2.0.txt https://raw.githubusercontent.com/hexgrad/kokoro/main/LICENSE
          curl -fsSL -o src/LICENSE-kokoro-onnx-MIT.txt https://raw.githubusercontent.com/thewh1teagle/kokoro-onnx/main/LICENSE
          K=https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0
          curl -fsSL -o src/model.onnx $K/kokoro-v1.0.int8.onnx
          curl -fsSL -o src/voices.bin $K/voices-v1.0.bin
          echo "6e742170d309016e5891a994e1ce1559c702a2ccd0075e67ef7157974f6406cb  src/model.onnx" | sha256sum -c
          echo "bca610b8308e8d99f32e6fe4197e7ec01679264efed0cac9140fe9c29f1fbf7d  src/voices.bin" | sha256sum -c
          python3 build_pack.py src/model.onnx src/voices.bin src/misaki out src/LICENSE-*.txt
          ls -la out
          gh release create "$TAG" out/* --repo "$GITHUB_REPOSITORY" --target main --prerelease \
            --title "Airline Manager Pro voice pack 1" \
            --notes "Voices for the people in Airline Manager Pro. Downloaded once by the app (Settings → Voices). Kokoro-82M v1.0 and misaki pronunciation dictionaries, both Apache License 2.0; see NOTICE.txt and the licence files."

  pc:
    name: PC app (Windows)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: Airline-Manager-Pro/pc-bridge
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build the app for the PC window
        working-directory: Airline-Manager-Pro
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Check the SimConnect library API
        run: npx tsc -p ci/tsconfig.json

      - name: Build
        run: npx tsc -p tsconfig.json

      - name: Test flight tracking and the Wi-Fi link
        run: npm test

      - name: Package
        run: node ci/package-pc.mjs

      - name: Smoke test the packaged app
        shell: pwsh
        run: |
          $dir = "build/Airline Manager Pro PC"
          # the tools program (no browser engine): a demo flight and the link
          $p = Start-Process -FilePath "$dir/AirlineManagerPro-Tools.exe" -ArgumentList "--demo","50" -PassThru -NoNewWindow
          Start-Sleep -Seconds 6
          $r = Invoke-RestMethod -Uri "http://127.0.0.1:47610/info"
          Write-Output ("Tools answered: " + $r.app + " " + $r.version)
          $h = Invoke-WebRequest -UseBasicParsing -Uri "http://127.0.0.1:47610/"
          if ($h.Content -notmatch "app.js") { Write-Output "The app page was not served"; Stop-Process -Id $p.Id -Force; exit 1 }
          Write-Output "The app page is served"
          Stop-Process -Id $p.Id -Force
          if ($r.app -ne "Airline Manager Pro") { exit 1 }
          Start-Sleep -Seconds 2
          # the app with its own browser engine: starts, opens its window, and the window loads the app and links to it
          $g = Start-Process -FilePath "$dir/AirlineManagerPro-PC.exe" -PassThru
          $log = Join-Path $env:APPDATA "Airline Manager Pro\pc-app.log"
          $ok = $false
          for ($i = 0; $i -lt 60 -and -not $ok; $i++) { Start-Sleep -Seconds 1; $ok = (Test-Path $log) -and (Select-String -Path $log -Pattern "Phone linked: This PC" -Quiet) }
          Start-Sleep -Seconds 6
          Write-Output "--- pc-app.log"; Get-Content $log -Tail 12 -ErrorAction SilentlyContinue
          $procs = @(Get-Process AirlineManagerPro-PC -ErrorAction SilentlyContinue)
          Write-Output ("Engine processes: " + $procs.Count + "; window: " + (($procs | Where-Object { $_.MainWindowTitle }) | Select-Object -First 1).MainWindowTitle)
          # a picture of the window on the build machine (no graphics card there: drawn in software)
          try { Add-Type -AssemblyName System.Windows.Forms, System.Drawing; $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds; $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height; $gr = [System.Drawing.Graphics]::FromImage($bmp); $gr.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size); $bmp.Save("build/own-engine-window.png") } catch { Write-Output "No screen picture: $_" }
          taskkill /F /IM AirlineManagerPro-PC.exe | Out-Null
          if (-not (Select-String -Path $log -Pattern "Own browser engine: Electron" -Quiet)) { Write-Output "The app didn't start with its own browser engine"; exit 1 }
          if (-not $ok) { Write-Output "The app window didn't load the app"; exit 1 }
          Write-Output "The app runs with its own browser engine"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: own-engine-window
          path: Airline-Manager-Pro/pc-bridge/build/own-engine-window.png
          if-no-files-found: ignore

      - name: Test Setup (install into a chosen folder, shortcut, Apps entry, then remove everything)
        timeout-minutes: 10
        shell: pwsh
        run: |
          $v = (Get-Content ../app.config.json | ConvertFrom-Json).version
          $setup = "build/AirlineManagerPro-PC-Setup-$v.exe"
          if (-not (Test-Path $setup)) { Write-Output "No Setup program"; exit 1 }
          $chosen = Join-Path $env:RUNNER_TEMP "Games"
          New-Item -ItemType Directory -Force -Path $chosen | Out-Null
          $desk = [Environment]::GetFolderPath('Desktop')
          # an old shortcut with another name, pointing at the app, must be replaced
          $ws = New-Object -ComObject WScript.Shell; $old = $ws.CreateShortcut((Join-Path $desk "AMP old.lnk")); $old.TargetPath = "C:\Old\AirlineManagerPro-PC.exe"; $old.Save()
          # wait for Setup itself only (not for the helpers it starts), at most two minutes
          function RunIt($file, $args2) { $q = Start-Process -FilePath $file -ArgumentList $args2 -PassThru; if (-not $q.WaitForExit(120000)) { Write-Output "Timed out: $file $args2"; Get-Content (Join-Path $env:TEMP "amp-setup.log") -ErrorAction SilentlyContinue; exit 1 }; return $q.ExitCode }
          Write-Output "1. Installing into $chosen"
          $code = RunIt $setup @("--silent","--dir",$chosen)
          Get-Content (Join-Path $env:TEMP "amp-setup.log") -ErrorAction SilentlyContinue
          if ($code -ne 0) { Write-Output "Setup failed: $code"; exit 1 }
          $dir = Join-Path $chosen "Airline Manager Pro"
          foreach ($f in @("AirlineManagerPro-PC.exe", "AirlineManagerPro-Tools.exe", "resources\app\main.js", "app.ico", "install.json", "app\index.html", "lib\node_modules\node-simconnect\package.json")) { if (-not (Test-Path (Join-Path $dir $f))) { Write-Output "Missing after install: $f"; exit 1 } }
          if (-not (Test-Path (Join-Path $desk "Airline Manager Pro.lnk"))) { Write-Output "No desktop shortcut"; exit 1 }
          if (Test-Path (Join-Path $desk "AMP old.lnk")) { Write-Output "The old shortcut was not replaced"; exit 1 }
          $lnk = $ws.CreateShortcut((Join-Path $desk "Airline Manager Pro.lnk")); Write-Output ("Shortcut: " + $lnk.TargetPath + " icon " + $lnk.IconLocation)
          $key = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\AirlineManagerPro"
          $r = Get-ItemProperty $key; Write-Output ("Apps entry: " + $r.DisplayName + " " + $r.DisplayVersion + " in " + $r.InstallLocation)
          if ($r.DisplayVersion -ne $v) { exit 1 }
          # installing again over it (an update) keeps working
          Write-Output "2. Installing again over it"
          $code = RunIt $setup @("--silent"); if ($code -ne 0) { Write-Output "Second install failed: $code"; exit 1 }
          # remove it: every file, the shortcut, the entry and the folder itself
          Write-Output "3. Removing it"
          $code = RunIt (Join-Path $dir "AirlineManagerPro-PC.exe") @("--uninstall","--silent"); Write-Output "Uninstall answered $code"
          for ($i = 0; $i -lt 30 -and (Test-Path $dir); $i++) { Start-Sleep -Seconds 1 }
          Write-Output "--- amp-setup.log"; Get-Content (Join-Path $env:TEMP "amp-setup.log") -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 3; Write-Output "--- amp-remove.log"; Get-Content (Join-Path $env:TEMP "amp-remove.log") -ErrorAction SilentlyContinue
          if (Test-Path $dir) { Write-Output "The folder is still there:"; Get-ChildItem -Recurse -Force $dir | Select-Object -First 10 FullName; exit 1 }
          if (Test-Path (Join-Path $desk "Airline Manager Pro.lnk")) { Write-Output "The shortcut is still there"; exit 1 }
          if (Test-Path $key) { Write-Output "The Apps entry is still there"; exit 1 }
          if (-not (Test-Path $chosen)) { Write-Output "The chosen folder itself was removed (it must stay)"; exit 1 }
          Write-Output "Setup installs and removes cleanly"

      - name: Zip
        id: zip
        shell: pwsh
        run: |
          $v = (Get-Content ../app.config.json | ConvertFrom-Json).version
          $f = "AirlineManagerPro-PC-$v.zip"
          Compress-Archive -Path "build/Airline Manager Pro PC" -DestinationPath $f
          Copy-Item "build/AirlineManagerPro-PC-Setup-$v.exe" .
          "file=$f" >> $env:GITHUB_OUTPUT
          "setup=AirlineManagerPro-PC-Setup-$v.exe" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: airline-manager-pro-pc
          path: |
            Airline-Manager-Pro/pc-bridge/${{ steps.zip.outputs.file }}
            Airline-Manager-Pro/pc-bridge/${{ steps.zip.outputs.setup }}

  apk:
    name: Android app
    needs: pc
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Airline-Manager-Pro
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Build web app
        run: npm run build

      - name: Prepare Android project
        run: bash scripts/android-setup.sh

      - name: Build APK
        working-directory: Airline-Manager-Pro/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Name the APK
        id: apk
        run: |
          V=$(node -p "require('./app.config.json').version")
          N=$(node -p "require('./app.config.json').appName.replace(/\s+/g,'')")
          F="${N}-${V}.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$F"
          keytool -printcert -jarfile "$F" | grep -m1 "Owner:"
          echo "file=Airline-Manager-Pro/$F" >> "$GITHUB_OUTPUT"
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          name: airline-manager-pro-pc
          path: pc

      - uses: actions/upload-artifact@v4
        with:
          name: airline-manager-pro-apk
          path: ${{ steps.apk.outputs.file }}

      - name: Publish pre-release
        if: github.ref == 'refs/heads/main'   # a test run from a work branch builds and tests, but never publishes
        uses: softprops/action-gh-release@v2
        with:
          tag_name: airline-manager-pro-v${{ steps.apk.outputs.version }}
          name: Airline Manager Pro ${{ steps.apk.outputs.version }}
          prerelease: true
          body_path: Airline-Manager-Pro/release-notes/${{ steps.apk.outputs.version }}.md
          files: |
            ${{ steps.apk.outputs.file }}
            pc/*.zip
            pc/*.exe
