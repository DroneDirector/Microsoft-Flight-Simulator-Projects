name: OSM airport samples
on: { push: { branches: [osm-fixtures] } }
permissions: { contents: write }
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          set +e
          mkdir -p out
          for A in EKVG EKCH EGLL KJFK ENBR BIKF; do
            Q="[out:json][timeout:60];area[\"aeroway\"=\"aerodrome\"][\"icao\"=\"$A\"]->.a;(way[\"aeroway\"~\"^(runway|taxiway|taxilane|apron|parking_position|terminal)$\"](area.a);node[\"aeroway\"~\"^(parking_position|gate)$\"](area.a););out body geom qt;"
            for S in https://overpass-api.de/api/interpreter https://overpass.private.coffee/api/interpreter https://maps.mail.ru/osm/tools/overpass/api/interpreter; do
              code=$(curl -sS -m 90 -A "AirlineManagerPro/0.5.8 (+https://dronedirector.fo)" -H "Accept: application/json" --data-urlencode "data=$Q" "$S" -o out/$A.json -w "%{http_code}")
              echo "$A $S -> $code $(wc -c < out/$A.json) bytes, $(gzip -c out/$A.json | wc -c) gzipped" >> out/summary.txt
              [ "$code" = "200" ] && break
              sleep 5
            done
            sleep 2
          done
          cat out/summary.txt
          git config user.name DroneDirector; git config user.email simon@dronedirector.fo
          git add out && git commit -qm "OSM samples" && git push -q origin HEAD:osm-fixtures
