name: Airline Manager Pro – terrain pictures to a branch

# Puts the side-by-side sheets of a terrain pictures run on the branch amp-shots (pictures only), so they can be
# looked at without downloading the run's files. The run is named in Airline-Manager-Pro/tools/shots/run-id.
on:
  push:
    branches: [amp-0.5.1-work]
    paths: ['Airline-Manager-Pro/tools/shots/run-id']

permissions:
  contents: write
  actions: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Which run
        id: run
        run: echo "id=$(tr -d ' \n' < Airline-Manager-Pro/tools/shots/run-id)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with: { name: terrain-pictures, path: /tmp/terrain, run-id: '${{ steps.run.outputs.id }}', github-token: '${{ secrets.GITHUB_TOKEN }}' }
      - name: Put the sheets on amp-shots
        run: |
          mkdir -p /tmp/out && cp /tmp/terrain/sheets/*.jpg /tmp/out/
          pip install -q pillow && python3 - <<'PY'
          import glob, os
          from PIL import Image
          for f in glob.glob('/tmp/terrain/*.png'):
              im = Image.open(f).convert('RGB'); im.thumbnail((1280, 1280)); im.save('/tmp/out/' + os.path.basename(f)[:-4] + '.jpg', quality=88)
          PY
          cd /tmp/out && git init -q && git checkout -q -b amp-shots
          git config user.name "DroneDirector"; git config user.email "simon@dronedirector.fo"
          git add . && git commit -qm "Terrain pictures from run ${{ steps.run.outputs.id }}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" amp-shots
